    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1031 180) rotate(90) scale(280 340)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4469A1" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#4469A1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" stroke="#7A93B9" stroke-opacity="0.07"/>
    </pattern>
