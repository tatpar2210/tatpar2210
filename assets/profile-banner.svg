<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" fill="none" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">Tatpar Mishra — Building useful products and the systems behind them</title>
  <desc id="banner-desc">A midnight navy profile banner with teal and lavender accents. Tatpar Mishra works across full stack engineering, applied AI, cloud, and security. His GitHub handle is @tatpar2210. A decorative terminal on the right reads build, ship, and improve.</desc>
  <defs>
